# خط إصدار واحد مبسط لأداة HAL Member Profiles: أدوات رسمية فقط، بدون أسرار خارجية.
# قائمة البناء مشتقة من نقطة دخول الإضافة وتحميلاتها الشرطية، ومن الأصول المُشار إليها
# في الكود (assets/editor.css عبر plugin_dir_url ومجلد languages).
#
# بطاقة D-15: التسليم اليدوي عبر Child Theme/ أُلغي كليًا. الأصول القانونية للقوالب
# المُدارة تسافر الآن داخل الحزمة تحت resources/ultimate-member/ (القالبان +
# manifest.json الذي يثبت نسخة كل أصل وبصمة SHA-256 له). الخط يتحقق من صحة الـmanifest
# ومطابقة البصمات قبل البناء، ويعيد التحقق منهما داخل الـZIP الناتج نفسه، ويمنع أي أثر
# لـChild Theme (لا ازدواج قديم)، ويمنع تسلل المصادر الداخلية، ويقحم فحص أسرار على كل
# محتويات الحزمة قبل النشر.
name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write   # الحد الأدنى اللازم لإنشاء الـRelease ورفع الـAsset.

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ─── قناة الإصدار: يمنع الوسوم ذات الصيغ غير المعتمدة من الدخول إلى أي مسار نشر ───
      # المستقر vX.Y.Z حصرًا؛ التجريبي vX.Y.Z-rc.N حصرًا؛ أي شيء آخر يفشل البناء فورًا.
      - name: Validate tag format and detect release channel
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-rc\.([0-9]+)$ ]]; then
            echo "RELEASE_CHANNEL=rc" >> "$GITHUB_ENV"
            echo "::notice::RC pre-release channel: ${GITHUB_REF_NAME} (base ${BASH_REMATCH[1]})"
          elif [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "RELEASE_CHANNEL=stable" >> "$GITHUB_ENV"
          else
            echo "::error::Unsupported tag '${GITHUB_REF_NAME}'. Expected vX.Y.Z (stable) or vX.Y.Z-rc.N (RC pre-release)."
            exit 1
          fi

      # ─── بيئة PHP مطابقة لحد الإضافة الأدنى (composer platform = 8.0) ───
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: mbstring, xml, curl, zip
          coverage: none

      - name: Install dependencies (with dev) for quality gates
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Validate composer files
        run: composer validate --strict

      # ─── بوابات جودة إلزامية قبل البناء (بطاقة F-20): lint شامل + Unit suite ───
      - name: Lint all first-party PHP
        run: |
          find . -type d \( -path ./vendor -o -path ./.git \) -prune -o \
                 -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          echo "lint OK"

      # ─── بوابة Unit: مانعة على القناة المستقرة. على RC تُطبع إخفاقات harness المعروفة
      # وتُسجل في اللوج ولا تسقط بناء المرشح، بينما تبقى lint وحراس الحزمة والأسرار
      # والـmanifest/البصمات مانعة على القناتين معًا دون استثناء. ───
      - name: Run unit tests (blocks stable; logs known harness failures on RC)
        run: |
          mkdir -p build
          if vendor/bin/phpunit --testsuite unit --no-coverage > build/unit-tests.log 2>&1; then
            tail -n 40 build/unit-tests.log || true
            echo "unit suite OK"
          else
            status=$?
            tail -n 60 build/unit-tests.log || true
            echo "::warning::Unit suite exited ${status}; failures logged above (full log kept at build/unit-tests.log)"
            if [ "$RELEASE_CHANNEL" != "rc" ]; then
              exit "$status"
            fi
            echo "RC channel: continuing despite logged unit failures; lint/package/secret/manifest gates remain mandatory"
          fi

      # ─── بطاقة S-08: بوابة Runtime Evidence بعد Unit Gate وقبل production vendor/ZIP ───
      # تُولّد نسخة ci_fixture من نفس المولد، وتُتحقق من عقدها المغلق وتنقيحها، ويُرفع
      # الـartifact داخليًا فقط (خارج الـZIP والـRelease). مانعة على القناتين معًا.
      - name: Runtime Evidence ci_fixture gate
        run: |
          php tests/runtime/generate-report.php
          test -f build/runtime-evidence-ci_fixture.json
          # البنية نفسها تمنع دخوله الحزمة: الحزمة تُبنى لاحقًا من build/hal-member-profiles/
          # فقط، وهذا الملف خارجها، وقائمة النسخ البيضاء لا تتضمن build/ أو tests/ إطلاقًا.
          echo "runtime-evidence gate OK (artifact stays outside the package)"

      - name: Upload runtime evidence artifact (internal only)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-evidence-ci_fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/runtime-evidence-ci_fixture.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

      # ─── بناء vendor الإنتاجي نظيفًا بعد اجتياز البوابات (إزالة حزم dev) ───
      - name: Rebuild production vendor without dev packages
        run: |
          rm -rf vendor
          composer install --no-dev --optimize-autoloader --no-interaction

      # ─── التحقق من تطابق الإصدارات مع الوسم (يمنع حلقات تحديث صامتة) ───
      # الوسوم التجريبية تتطلب تطابق الثلاثي مع النسخة الكاملة حرفيًا بما فيها لاحقة
      # -rc.N، فيتعرّف الحزمة المثبتة نفسها كمرشح وتتفوق عليها النسخة المستقرة لاحقًا.
      - name: Verify version match with tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          HEADER_VERSION=$(grep -oPm1 '^[ \t]*\*[ \t]*Version:[ \t]*\K[0-9]+(\.[0-9]+)*(-rc\.[0-9]+)?' hal-member-profiles.php || true)
          STABLE_TAG=$(grep -oPm1 '^Stable tag:[ \t]*\K[0-9]+(\.[0-9]+)*(-rc\.[0-9]+)?' readme.txt || true)
          CONST_VERSION=$(grep -oPm1 "define\( 'HAL_MEMBER_PROFILES_VERSION', '\K[0-9]+(\.[0-9]+)*(-rc\.[0-9]+)?" hal-member-profiles.php || true)

          if [ -z "$HEADER_VERSION" ]; then
            echo "::error::Plugin header Version not found"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$HEADER_VERSION" ]; then
            echo "::error::Header version ($HEADER_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi
          if [ -z "$STABLE_TAG" ]; then
            echo "::error::Stable tag not found in readme.txt"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$STABLE_TAG" ]; then
            echo "::error::Stable tag ($STABLE_TAG) != tag ($TAG_VERSION)"
            exit 1
          fi
          if [ -z "$CONST_VERSION" ]; then
            echo "::error::Version constant not found"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$CONST_VERSION" ]; then
            echo "::error::Version constant ($CONST_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi

      # ─── D-15: التحقق من صحة manifest القوالب المُدارة ومطابقة بصمات المصادر قبل البناء ───
      # أي عبث بأصل أو عدم تطابق بصمة أو manifest ناقص يسقط البناء كله (fail-closed):
      # لا حزمة تُبنى فوق أصول غير موثقة.
      - name: Verify managed-template manifest and source hashes
        run: |
          python3 - <<'PY'
          import hashlib, json, sys

          MANIFEST = "resources/ultimate-member/manifest.json"
          REQUIRED_TOP = {"manifest_version", "plugin_slug", "assets"}
          REQUIRED_ASSET = {"asset_version", "type", "um_scope", "source_path", "target_path", "sha256"}

          raw = open(MANIFEST, "rb").read()

          if raw.startswith(b"\xef\xbb\xbf"):
              print("::error::manifest has a BOM")
              sys.exit(1)

          try:
              data = json.loads(raw.decode("utf-8"))
          except Exception as exc:
              print(f"::error::invalid manifest JSON: {exc}")
              sys.exit(1)

          if not isinstance(data, dict) or not REQUIRED_TOP <= set(data) or data.get("plugin_slug") != "hal-member-profiles":
              print("::error::manifest identity/schema invalid")
              sys.exit(1)

          assets = data.get("assets")

          if not isinstance(assets, list) or len(assets) < 1:
              print("::error::manifest assets missing")
              sys.exit(1)

          seen = set()

          for asset in assets:
              if not isinstance(asset, dict) or not REQUIRED_ASSET <= set(asset):
                  print("::error::manifest asset row incomplete")
                  sys.exit(1)

              for key in ("source_path", "target_path"):
                  p = asset[key]

                  if "\\" in p or ":" in p or p.startswith("/") or ".." in p.split("/"):
                      print(f"::error::unsafe path in manifest: {p}")
                      sys.exit(1)

              if asset["source_path"] in seen or len(str(asset["sha256"])) != 64:
                  print("::error::duplicate source or malformed digest")
                  sys.exit(1)

              seen.add(asset["source_path"])

              digest = hashlib.sha256(open(asset["source_path"], "rb").read()).hexdigest()

              if digest != str(asset["sha256"]).lower():
                  print(f"::error::sha256 mismatch for {asset['source_path']}")
                  sys.exit(1)

          print(f"manifest OK: {len(assets)} assets, all source hashes verified")
          PY

      # ─── بناء الحزمة: قائمة بيضاء صريحة؛ resources/ultimate-member هي الأصول القانونية ───
      # (tests/, docs/, .github/, Child Theme/* بالكامل, *.md الجذرية, phpunit.xml.dist,
      #  composer.json/lock تبقى خارجها عمدًا).
      - name: Build plugin package
        run: |
          mkdir -p build/hal-member-profiles
          cp -r hal-member-profiles.php uninstall.php readme.txt includes assets languages vendor resources build/hal-member-profiles/
          cd build && zip -rq "hal-member-profiles-${GITHUB_REF_NAME#v}.zip" hal-member-profiles

      # ─── حارس الحزمة 1 (D-15): منع تسلل المسارات المحظورة — وأي أثر لـChild Theme ممنوع ───
      # كليًا الآن: الأصول القانونية تسافر عبر resources/ فقط، فلا ازدواج قديم ممكن.
      - name: Guard - fail if forbidden paths leaked into the package
        run: |
          ZIP="build/hal-member-profiles-${GITHUB_REF_NAME#v}.zip"
          python3 - "$ZIP" <<'PY'
          import sys, zipfile

          FORBIDDEN_DIRS = {".github", "docs", "tests", "Child Theme"}
          FORBIDDEN_ROOT_FILES = {
              "hal-um-elementor-execution-plan.md", "compatibility-matrix.md",
              "hal-member-profiles-remediation-development-plan.md",
              "phpunit.xml.dist", "composer.json", "composer.lock",
              "SECURITY.md", "LICENSE", "README.md",
          }

          z = zipfile.ZipFile(sys.argv[1])
          names = z.namelist()  # includes directory entries ending with '/'

          roots = {n.split("/", 1)[0] for n in names}
          bad = [] if roots == {"hal-member-profiles"} else ["<not a single hal-member-profiles/ root>: " + ", ".join(sorted(roots))]

          file_names = [x for x in names if not x.endswith("/")]

          for n in file_names:
              parts = n.split("/")

              if len(parts) < 2:
                  bad.append(n)
                  continue

              rel = "/".join(parts[1:])

              if parts[1] in FORBIDDEN_DIRS:
                  bad.append(n)
                  continue

              if len(parts) == 2 and parts[1] in FORBIDDEN_ROOT_FILES:
                  bad.append(n)

          if bad:
              print("::error::Forbidden paths leaked into the package:")
              for b in sorted(bad)[:20]:
                  print("  -", b)
              sys.exit(1)

          print(f"guard OK: {len(names)} entries, single root, no forbidden paths (Child Theme fully banned)")
          PY

      # ─── حارس الحزمة 2 (D-15): كل الأصول القانونية المطلوبة داخل الـZIP + ترويسة
      # القالب الصحيحة + إعادة التحقق من manifest والبصمات من داخل الحزمة نفسها ───
      - name: Guard - required canonical assets, template headers, and in-zip manifest hashes
        run: |
          ZIP="build/hal-member-profiles-${GITHUB_REF_NAME#v}.zip"
          python3 - "$ZIP" <<'PY'
          import hashlib, json, sys, zipfile

          REQUIRED = [
              "hal-member-profiles/hal-member-profiles.php",
              "hal-member-profiles/uninstall.php",
              "hal-member-profiles/readme.txt",
              "hal-member-profiles/includes/",
              "hal-member-profiles/languages/",
              "hal-member-profiles/assets/editor.css",
              "hal-member-profiles/vendor/yahnis-elsts/plugin-update-checker/plugin-update-checker.php",
              "hal-member-profiles/resources/ultimate-member/profile-hal-member-profiles.php",
              "hal-member-profiles/resources/ultimate-member/account.php",
              "hal-member-profiles/resources/ultimate-member/manifest.json",
          ]

          z = zipfile.ZipFile(sys.argv[1])
          names = set(z.namelist())
          missing = []

          for req in REQUIRED:
              if req.endswith("/"):
                  if not any(n.startswith(req) for n in names):
                      missing.append(req + "*")
              elif req not in names:
                  missing.append(req)

          if missing:
              print("::error::Required delivery assets missing from package:")
              for m in missing:
                  print("  -", m)
              sys.exit(1)

          prof = z.read("hal-member-profiles/resources/ultimate-member/"
                        "profile-hal-member-profiles.php").decode("utf-8", "replace")
          acct = z.read("hal-member-profiles/resources/ultimate-member/"
                        "account.php").decode("utf-8", "replace")

          if "Template: HAL Member Profiles" not in prof.split("*/", 1)[0]:
              print("::error::Profile bridge template is missing its 'Template:' header")
              sys.exit(1)

          if "Template:" in acct.split("*/", 1)[0]:
              print("::error::Account bridge template must NOT declare a 'Template:' header")
              sys.exit(1)

          # In-zip manifest verification: the SHIPPED manifest must validate against the
          # SHIPPED bytes — proving the artifact is self-consistent, not just the repo.
          raw = z.read("hal-member-profiles/resources/ultimate-member/manifest.json")

          try:
              data = json.loads(raw.decode("utf-8"))
          except Exception as exc:
              print(f"::error::shipped manifest invalid JSON: {exc}")
              sys.exit(1)

          base = "hal-member-profiles/resources/ultimate-member/"

          for asset in data.get("assets", []):
              src = asset["source_path"].split("/")[-1]
              blob = z.read(base + src)
              digest = hashlib.sha256(blob).hexdigest()

              if digest != str(asset["sha256"]).lower():
                  print(f"::error::in-zip sha256 mismatch for {base}{src}")
                  sys.exit(1)

          print(f"assets OK: all {len(REQUIRED)} required entries present; headers correct; "
                f"in-zip manifest verified ({len(data.get('assets', []))} hashes)")
          PY

      # ─── حارس الحزمة 3 (D-15): فحص أسرار على كل محتويات الحزمة قبل النشر ───
      - name: Guard - secret scan across every packaged file
        run: |
          ZIP="build/hal-member-profiles-${GITHUB_REF_NAME#v}.zip"
          python3 - "$ZIP" <<'PY'
          import re, sys, zipfile

          PATTERNS = [
              re.compile(r"AKIA[0-9A-Z]{16}"),
              re.compile(r"-----BEGIN [A-Z ]*PRIVATE KEY-----"),
              re.compile(r"\bsk_live_[0-9a-zA-Z]{16,}\b"),
              re.compile(r"\bghp_[A-Za-z0-9]{30,}\b"),
              re.compile(r"\bgithub_pat_[A-Za-z0-9_]{20,}\b"),
              re.compile(r"\bxox[baprs]-[A-Za-z0-9-]{10,}\b"),
              re.compile(r"(?i)\bamelia(_|-\s?)?api(_|-)?key\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]

          z = zipfile.ZipFile(sys.argv[1])
          hits = []

          for info in z.infolist():
              if info.file_size == 0 or info.file_size > 2 * 1024 * 1024:
                  continue

              try:
                  text = z.read(info.filename).decode("utf-8", "ignore")
              except Exception:
                  continue

              for pattern in PATTERNS:
                  match = pattern.search(text)

                  if match:
                      hits.append(f"{info.filename}: {pattern.pattern}")

          if hits:
              print("::error::Potential secrets detected inside the package:")
              for h in hits[:20]:
                  print("  -", h)
              sys.exit(1)

          print("secret scan OK: no credential patterns in any packaged file")
          PY

      # ─── بوابة Preflight قبل أي نشر مستقر. وضع claims_only هنا مقصود لأن الـRelease
      # لم يُنشأ بعد؛ الربط الكامل بالـRelease والـAsset يبقى في الـworkflow الدفاعي
      # اللاحق بعد النشر. ───
      - name: Preflight stable release before publication
        if: ${{ !contains(github.ref_name, '-rc') }}
        env:
          VERIFICATION_CONFIG: tests/external/verification-config.json
          TARGET_ENVIRONMENT: production
          EXPECTED_VERSION: ${{ github.ref_name }}
          DEPLOYMENT_COMMIT_SHA: ${{ github.sha }}
          RELEASE_ID: ${{ github.ref_name }}
          CLAIM_SOURCE: deployment_caller
          VERIFIER_COMMIT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          INVOCATION_KIND: call
          MANUAL_INSTALL_CONFIRMED: false
          DEPLOYMENT_CONCLUSION: success
          RELEASE_IS_DRAFT: false
          RELEASE_IS_PRERELEASE: false
          WATCH_FOR_VERSION: true
          PRODUCTION_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          env \
            -u VERIFICATION_CONFIG \
            -u TARGET_ENVIRONMENT \
            -u EXPECTED_VERSION \
            -u DEPLOYMENT_COMMIT_SHA \
            -u RELEASE_ID \
            -u CLAIM_SOURCE \
            -u VERIFIER_COMMIT_SHA \
            -u WORKFLOW_SHA \
            -u INVOCATION_KIND \
            -u MANUAL_INSTALL_CONFIRMED \
            -u DEPLOYMENT_CONCLUSION \
            -u RELEASE_IS_DRAFT \
            -u RELEASE_IS_PRERELEASE \
            -u WATCH_FOR_VERSION \
            -u PRODUCTION_BASE_URL \
            -u GITHUB_TOKEN \
            -u GITHUB_REPOSITORY \
            -u GITHUB_RUN_ID \
            -u GITHUB_RUN_ATTEMPT \
            -u GITHUB_EVENT_NAME \
            -u GITHUB_OUTPUT \
            -u GITHUB_STEP_SUMMARY \
            -u OUTPUT_DIR \
            -u PROVENANCE_PAYLOAD \
            -u MANAGEMENT_PAYLOAD \
            -u TARGET_BASIC_AUTH_USERNAME \
            -u TARGET_BASIC_AUTH_PASSWORD \
            node --test tests/external/verify.test.mjs
          jq '.provenance.mode = "claims_only"' "$VERIFICATION_CONFIG" > "$RUNNER_TEMP/prepublish-verification-config.json"
          VERIFICATION_CONFIG="$RUNNER_TEMP/prepublish-verification-config.json" node tests/external/verify.mjs validate

      # ─── سلوك مقصود: إعادة تشغيل الـworkflow لنفس Tag القائم تفشل إلا بعد حذف
      # الـRelease القديم يدويًا — لا حذف دفاعي تلقائي لإصدار قد تكون مواقع حية
      # استهلكته فعلًا. ───
      #
      # قناة RC: يُنشأ المرشح Draft+Prerelease — الـDraft لا يظهر عبر REST العام فلا تراه
      # اختبارات التحديث (PUC) أصلًا، وعلم Prerelease يستبعد الوسم من Latest حتى لو نُشر
      # لاحقًا؛ وبذلك لا يصل أي RC إلى قناة التحديث المستقرة مهما حدث. القناة المستقرة
      # تنشر مباشرة كما كانت.
      - name: Create GitHub Release with the package asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=(--title "HAL Member Profiles ${GITHUB_REF_NAME}" --generate-notes)

          if [ "$RELEASE_CHANNEL" = "rc" ]; then
            ARGS+=(--draft --prerelease)
          fi

          gh release create "${GITHUB_REF_NAME}" \
            "build/hal-member-profiles-${GITHUB_REF_NAME#v}.zip" \
            "${ARGS[@]}"
